name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two versions the package is actually developed against: 3.10 is
        # the floor required by run_gifba's PEP 604 signature, 3.13 the ceiling
        # allowed by requires-python.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Installs cobra (which vendors the GLPK solver via swiglpk) but not
      # gurobipy or micom -- those are optional extras, and this runner has no
      # Gurobi license. This step doubles as a check that pyproject.toml is
      # installable in a clean environment.
      - name: Install gifba with test extras
        run: python -m pip install -e "./package[test]"

      - name: Show resolved environment
        run: |
          python -c "import cobra, numpy, pandas, scipy; print('cobra', cobra.__version__); print('numpy', numpy.__version__); print('pandas', pandas.__version__); print('scipy', scipy.__version__)"
          python -c "from cobra.util.solver import solvers; print('solvers:', sorted(solvers))"

      - name: Run tests
        run: python -m pytest package/tests
