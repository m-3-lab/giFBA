[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "gifba"
version = "0.1.0"
description = "A set of tools and helpers for running iterative interaction flux balance analysis with COBRApy models"
authors = [
    { name="M-3-Lab", email="your.email@example.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
    "cobra>=0.27.0",
    "micom>=0.36.0",
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.8.1",
    "gurobi>=12.0.0"
]

[project.urls]
Homepage = "https://m-3-lab.github.io"

[tool.setuptools]
package-data = { "gifba" = ["Toy_Models/*.json"] }

[tool.setuptools.packages.find]
include = ["gifba*"]
