[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "gifba"
version = "0.1.0"
description = "A set of tools and helpers for running iterative interaction flux balance analysis with COBRApy models"
authors = [
    { name="M-3-Lab", email="your.email@example.com" }
]
license = { text = "MIT" }
readme = "README.md"
# 3.10 floor: run_gifba's signature uses PEP 604 (`float | None`), which is
# evaluated at def time and raises TypeError on 3.8/3.9.
requires-python = ">=3.10, <3.14"

dependencies = [
    "cobra>=0.27.0",
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.8.1"
]

# micom is imported lazily inside utils.prep_micom_cfba and
# prepare_compartmentalized_model_with_micom; gurobipy is never imported by
# this package at all and is only needed so optlang can find Gurobi. Neither
# is required for the core run_gifba path, which works on cobra's bundled GLPK.
[project.optional-dependencies]
test = ["pytest>=7.0"]
micom = ["micom>=0.36.0"]
gurobi = ["gurobipy>=10.0.0"]

[project.urls]
Homepage = "https://m-3-lab.github.io"

[tool.setuptools]
package-data = { "gifba" = ["Toy_Models/*.json"] }

[tool.setuptools.packages.find]
include = ["gifba*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: tests that take more than a second"]
